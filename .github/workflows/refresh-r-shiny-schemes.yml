name: Refresh R Shiny scheme data

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::rjson
            any::stringr

      - name: Refresh mfapi and AMFI NAVAll data
        working-directory: app
        run: Rscript refresh_mf_codes.R

      - name: Commit refreshed R Shiny scheme data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh R Shiny scheme data"
          file_pattern: app/mf_codes.RData app/mf_codes_equity.RData app/nav_cache/navall_categorized.rds
